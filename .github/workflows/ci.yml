name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Format and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run typecheck

  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: SDK
        run: npm test -w packages/sdk
      - name: Map lab
        run: npm test -w apps/map-lab

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: SDK
        run: npm run build -w packages/sdk
      - name: SDK package contents
        run: npm pack --dry-run -w packages/sdk
      - name: Map lab
        run: npm run build -w apps/map-lab

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -f apps/map-lab/Dockerfile -t 4shadow-map:ci .
      - name: Smoke test
        # No API key here: the page must load, and the public map must refuse what it doesn't serve.
        run: |
          docker run -d --name map -p 3000:3000 4shadow-map:ci
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:3000/ && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/4shadow/v2/alerts)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/4shadow/v2/keys)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/rig/feed)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:3000/api/4shadow/v2/gfs/fields/2026111600/f003?vars=t2m&stride=1')" = 400
      - name: Logs
        if: always()
        run: docker logs map || true
